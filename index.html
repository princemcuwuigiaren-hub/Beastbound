<!DOCTYPE html>
<html lang="en">
<head>

<title>Beastbound</title>

<style>
:root{
  --night:#0b0a1c; --dusk:#241349; --moon:#f3e3b3; --ember:#ff7a2f; --gold:#e8c36a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;
  font-family:"Cinzel",Georgia,"Times New Roman",serif;color:var(--moon);-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 70% 22%, rgba(243,227,179,.28) 0, rgba(243,227,179,0) 32%),
    linear-gradient(180deg,var(--dusk) 0%, var(--night) 70%)}
.moon{position:absolute;top:12%;right:18%;width:min(26vmin,150px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7de,var(--moon) 60%,#d8c08a);
  box-shadow:0 0 60px 20px rgba(243,227,179,.25)}
.ridge{position:absolute;left:0;right:0;bottom:0;height:22%;
  background:#06050f;clip-path:polygon(0 60%,12% 35%,24% 55%,38% 20%,52% 50%,66% 28%,80% 52%,92% 30%,100% 48%,100% 100%,0 100%)}
.creature{position:absolute;left:0;font-size:var(--s);filter:brightness(0) drop-shadow(0 0 6px rgba(255,122,47,.35));
  opacity:.85;will-change:transform;animation:fly var(--d) linear infinite;animation-delay:var(--delay);top:var(--y)}
.creature i{display:block;font-style:normal;animation:bob var(--b) ease-in-out infinite}
@keyframes fly{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
@keyframes bob{50%{transform:translateY(-14px) rotate(-4deg)}}
.rtl{animation-name:flyback}
.rtl i{transform:scaleX(-1)}
@keyframes flyback{from{transform:translateX(125vw)}to{transform:translateX(-25vw)}}
.ember{position:absolute;bottom:-10px;width:var(--w);height:var(--w);border-radius:50%;background:var(--ember);
  box-shadow:0 0 8px 2px rgba(255,122,47,.7);opacity:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{10%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-85vh)}}
.ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,5vh,40px);padding:20px}
h1{margin:0;font-weight:800;font-size:clamp(40px,13vw,92px);letter-spacing:.06em;text-align:center;line-height:1;
  background:linear-gradient(180deg,#fff2c4,var(--gold) 55%,#b8812e);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,122,47,.45))}
.tag{margin:-8px 0 0;font-weight:500;font-size:clamp(13px,3.6vw,18px);letter-spacing:.12em;text-align:center;color:var(--moon);opacity:.8}
nav{display:flex;flex-direction:column;gap:14px;width:min(78vw,320px)}
button{font:inherit;font-weight:500;font-size:18px;letter-spacing:.14em;color:var(--moon);
  padding:16px 20px;min-height:54px;border-radius:6px;cursor:pointer;
  background:rgba(20,12,44,.72);border:1.5px solid rgba(232,195,106,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
button.primary{font-weight:800;color:#2a1300;border-color:#ffb066;
  background:linear-gradient(180deg,#ffd27a,#ff9a3c);box-shadow:0 0 24px rgba(255,122,47,.45)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (hover:hover){button:not(.primary):hover{background:rgba(60,30,100,.8);border-color:var(--gold)}}
@media (prefers-reduced-motion:reduce){.creature,.creature i,.ember{animation:none}.ember{display:none}.creature{left:60%}}
@media (orientation:landscape) and (max-height:480px){.ui{flex-direction:row;flex-wrap:wrap;gap:24px 48px}nav{flex-direction:column}}
.creature{position:absolute;left:var(--x);top:44%;width:var(--w);font-size:0;opacity:0;filter:drop-shadow(0 0 10px rgba(255,122,47,.4));animation:soar var(--d) ease-in infinite;animation-delay:var(--delay)}
.creature svg{display:block;width:100%;height:auto}
.wg{animation:flap 1.1s ease-in-out infinite alternate}.wg.r{transform-origin:110px 44px}.wg.l{transform-origin:90px 44px;animation-name:flapl}
@keyframes flap{from{transform:rotate(9deg)}to{transform:rotate(-15deg)}}@keyframes flapl{from{transform:rotate(-9deg)}to{transform:rotate(15deg)}}
@keyframes soar{0%{opacity:0;transform:translate(0,22vh) scale(.2)}12%{opacity:.95}80%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-48vh) scale(1.7)}}
[hidden]{display:none!important}
.fire{--c:#ff7a3a;--d1:#2a0b06;--d2:#6b2010}.ice{--c:#6fd0ff;--d1:#081a2c;--d2:#144a73}.nature{--c:#6fe07a;--d1:#071d0e;--d2:#17572b}
.lightning{--c:#ffd84a;--d1:#241c04;--d2:#6b5208}.shadow{--c:#b494ff;--d1:#120a26;--d2:#3b2273}.neutral{--c:#e8c36a;--d1:#111016;--d2:#2d2a3a}
#game{position:fixed;top:0;left:0;z-index:3;display:grid;grid-template-columns:clamp(88px,calc(var(--vw)*15),124px) 1fr clamp(88px,calc(var(--vw)*15),124px);gap:8px;--ch:clamp(62px,calc(var(--vh)*25),108px);
 padding:8px 12px;
 background:radial-gradient(ellipse at 50% 40%,rgba(30,18,64,.93),rgba(6,5,14,.97) 75%)}
.center{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
.gbar{display:flex;align-items:center;gap:10px;min-height:30px}
.gbar .mini{min-height:30px;padding:4px 12px;font-size:11px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.14em;color:var(--c)}
#turn{margin-left:auto;font-size:12px;letter-spacing:.1em;color:var(--gold)}
.sg{width:1em;height:1em;display:inline-block;vertical-align:middle}
.side{display:flex;flex-direction:column;gap:6px;min-height:0}
.beast{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;text-align:center;border-radius:8px;color:var(--c);
 background:linear-gradient(160deg,var(--d2),var(--d1));border:1px solid rgba(232,195,106,.55);font-size:10px;letter-spacing:.04em}
.beast b{font-size:11px;color:#f3e3b3;line-height:1.1}.beast small{opacity:.85;font-size:9px}
.ring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:1.5px solid var(--c);box-shadow:0 0 10px var(--c),inset 0 0 8px rgba(0,0,0,.6)}
.beast.cd{filter:grayscale(.8) brightness(.6)}.beast u{position:absolute;top:3px;right:6px;text-decoration:none;font-size:12px;color:#fff}
.beast.elig{border-color:var(--c);box-shadow:0 0 16px var(--c);animation:pulse 1s infinite;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.04)}}
.side.hit{animation:hit .5s}@keyframes hit{30%{box-shadow:0 0 30px 6px #f33;transform:translateX(3px)}60%{transform:translateX(-3px)}}
.card{--cw:calc(var(--ch)*.68);width:var(--cw);height:var(--ch);border-radius:calc(var(--ch)*.08);position:relative;flex:0 0 auto;overflow:hidden;color:var(--c);
 background:linear-gradient(160deg,var(--d2),var(--d1));border:1px solid rgba(232,195,106,.9);font-family:Cinzel,Georgia,serif;user-select:none;
 box-shadow:0 5px 12px rgba(0,0,0,.65),inset 0 0 0 3px rgba(0,0,0,.4),inset 0 0 0 4px rgba(232,195,106,.35)}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%),repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px)}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.17) 48%,transparent 60%)}
.cc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:1}
.cc .sg{width:46%;height:auto;filter:drop-shadow(0 0 7px var(--c))}.cc.act .sg{width:52%}
.big{font-size:calc(var(--ch)*.3);font-weight:800;text-shadow:0 0 10px var(--c)}.big.sm{font-size:calc(var(--ch)*.18)}
.lbl{position:absolute;left:0;right:0;bottom:calc(var(--ch)*.07);text-align:center;font-size:calc(var(--ch)*.075);letter-spacing:.12em;color:#f3e3b3;z-index:1}
.cn{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1;gap:1px}
.cn b{font-size:calc(var(--ch)*.17);font-weight:800;color:#f6ead0}.cn .sg{width:calc(var(--ch)*.13);height:auto}
.cn.tl{top:calc(var(--ch)*.05);left:calc(var(--cw)*.1)}.cn.br{bottom:calc(var(--ch)*.05);right:calc(var(--cw)*.1);transform:rotate(180deg)}
.card.back{--c:#e8c36a;background:linear-gradient(160deg,#2a1a5a,#0e0824)}
.card.back::before{background:repeating-linear-gradient(45deg,rgba(232,195,106,.22) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,rgba(232,195,106,.22) 0 1px,transparent 1px 7px)}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;min-height:0}
.mid .card,#top{--ch:clamp(70px,calc(var(--vh)*29),124px)}
.pile{padding:0;border:0;background:none;min-height:0;position:relative;letter-spacing:0;backdrop-filter:none}
.pile .cnt{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:calc(var(--ch)*.26);font-weight:800;color:#f3e3b3;text-shadow:0 2px 6px #000}
.opp{display:flex;align-items:center;gap:8px;min-height:32px;font-size:11px;letter-spacing:.1em}
.opp .cards{display:flex}.opp .card{--ch:clamp(30px,calc(var(--vh)*11),46px);border-radius:4px}.opp .card+.card{margin-left:calc(var(--cw)*-.55)}
.strip{display:flex;align-items:center;gap:10px;min-height:30px}
#msg{margin:0;flex:1;font-size:11px;opacity:.9;line-height:1.25}
.acts{display:flex;gap:8px}.acts button{min-height:30px;padding:4px 14px;font-size:12px}
.hand{display:flex;overflow-x:auto;overflow-y:hidden;padding:12px 6px 2px;flex:0 0 auto;scrollbar-width:none}
.hand::before,.hand::after{content:'';margin:auto}
.hand .card+.card{margin-left:calc(var(--cw)*-.2)}
.hand .card.no{filter:brightness(.55)}.hand .card.ok{transform:translateY(-12px);box-shadow:0 0 16px var(--c),0 5px 12px #000;cursor:pointer;z-index:2}
#modal{position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:linear-gradient(160deg,#241448,#0d0820);border:1px solid var(--gold);border-radius:12px;padding:16px;width:min(92vw,380px);max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:center}
.box h2{margin:0;font-size:18px;color:var(--gold);letter-spacing:.1em}.box p{margin:0;font-size:13px}.box button{min-height:42px;padding:8px;font-size:14px}
.eb .sg{color:var(--c)}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.land{animation:land .35s ease-out}@keyframes land{from{transform:scale(1.5) rotate(-9deg);filter:brightness(2)}to{transform:none}}
.fly{position:absolute;left:0;top:0;z-index:6;pointer-events:none;transform-style:preserve-3d;--ch:clamp(70px,calc(var(--vh)*29),124px);--cw:calc(var(--ch)*.68);width:var(--cw);height:var(--ch)}
.fly .ff,.fly .fb{position:absolute;left:0;top:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}.fly .fb{transform:rotateY(180deg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;min-height:0;font-size:15px;color:var(--c);background:linear-gradient(160deg,var(--d2),var(--d1))}
.tile b{font-size:12px;color:#f3e3b3}.tile small{font-size:10px;opacity:.85;letter-spacing:.04em}.tile .sg{font-size:22px}
.tile.sel{border-color:var(--gold);box-shadow:0 0 14px var(--c)}
.cdn{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.cdn i{display:block;height:100%;background:var(--gold);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.beast small.st{font-size:9px;color:#f3e3b3;letter-spacing:.12em}
#beastBtns{display:flex;gap:8px}#beastBtns button{min-height:30px;padding:4px 12px;font-size:12px}
.emerge{position:absolute;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--c)}
.emerge .eg{width:calc(var(--vh)*30);height:calc(var(--vh)*30);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--vh)*17);border:2px solid var(--c);background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);box-shadow:0 0 40px var(--c),inset 0 0 30px rgba(0,0,0,.6)}
.emerge b{font-size:14px;letter-spacing:.22em;color:#f3e3b3;text-shadow:0 2px 8px #000}
.barrier{position:absolute;z-index:5;pointer-events:none;border:2px solid var(--c);border-radius:18px;opacity:0;
 background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--c) 35%,transparent),transparent 72%),repeating-linear-gradient(60deg,transparent 0 9px,color-mix(in srgb,var(--c) 40%,transparent) 9px 10px),repeating-linear-gradient(-60deg,transparent 0 9px,color-mix(in srgb,var(--c) 40%,transparent) 9px 10px);box-shadow:0 0 26px var(--c),inset 0 0 20px var(--c)}
.frost{position:absolute;z-index:4;pointer-events:none;border-radius:8px;background:linear-gradient(120deg,rgba(190,235,255,.55),rgba(90,170,230,.35) 50%,rgba(220,245,255,.6)),repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.25) 0 10deg,transparent 10deg 30deg);box-shadow:0 0 22px rgba(120,210,255,.8),inset 0 0 18px rgba(255,255,255,.6)}
.frost.spread{animation:spread .9s ease-out}@keyframes spread{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:800 clamp(22px,calc(var(--vh)*10),42px) Cinzel,Georgia,serif;letter-spacing:.16em;opacity:0;pointer-events:none;z-index:6;text-shadow:0 0 18px currentColor,0 2px 4px #000}
#banner.show{animation:bn 1.1s ease-out}@keyframes bn{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-10px)}}
.rew{color:var(--gold);font-size:16px!important;letter-spacing:.1em}
#shards{position:absolute;top:14px;right:16px;font-size:12px;letter-spacing:.14em;color:var(--gold);text-shadow:0 2px 6px #000;z-index:2}
@media (prefers-reduced-motion:reduce){.beast.elig{animation:none}}
#coll{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;gap:8px;padding:8px 12px;background:radial-gradient(ellipse at 50% 30%,#241448,#07060f 80%)}
.cbar{display:flex;align-items:center;gap:12px;min-height:34px}.cbar b{letter-spacing:.2em;color:var(--gold)}#cInfo{margin-left:auto;font-size:12px;letter-spacing:.12em;color:var(--gold)}
.cbar button{min-height:34px;padding:4px 14px;font-size:12px}.cbar button:disabled{opacity:.4}
.cbody{flex:1;min-height:0;display:flex;gap:10px}
.cgrid{flex:1;min-width:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;padding:2px}
.btile{display:flex;flex-direction:column;gap:3px;padding:8px;border-radius:10px;color:var(--c);background:linear-gradient(160deg,var(--d2),var(--d1));border:1px solid rgba(232,195,106,.35);font-size:10px}
.btile.eq{border-color:var(--gold);box-shadow:0 0 12px var(--c)}.btile .bt{display:flex;align-items:center;gap:6px;font-size:18px}.btile .bt b{font-size:13px;color:#f3e3b3}
.btile small{opacity:.9;line-height:1.25}.btile .ab{color:#e8dcc0}.btile button{min-height:30px;padding:4px;font-size:11px;margin-top:auto}
.rar{font-size:9px;letter-spacing:.14em}.r-common{color:#c7ccd6}.r-rare{color:#5aa8ff}.r-epic{color:#b46bff}.r-legendary{color:#ffcf4a}
.cside{width:clamp(130px,24%,190px);display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.06em}.cside h3{margin:0;font-size:12px;color:var(--gold);letter-spacing:.16em}
.slot{padding:8px 6px;border:1px dashed rgba(232,195,106,.4);border-radius:8px;text-align:center;opacity:.6}.slot.on{border-style:solid;opacity:1;color:#f3e3b3;background:rgba(232,195,106,.08)}
#summon{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:radial-gradient(circle at 50% 45%,#2a1660,#07050f 70%)}
#summon[data-r=rare]{background:radial-gradient(circle at 50% 45%,#12306b,#07050f 70%)}#summon[data-r=epic]{background:radial-gradient(circle at 50% 45%,#47207a,#07050f 70%)}#summon[data-r=legendary]{background:radial-gradient(circle at 50% 45%,#6a4a08,#07050f 70%)}
.rune{width:calc(var(--vh)*38);height:calc(var(--vh)*38);border-radius:50%;border:3px solid #b9a3ff;box-shadow:0 0 40px #8a6bff,inset 0 0 40px #8a6bff;background:conic-gradient(from 0deg,transparent,#8a6bff66,transparent 40%);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.sline{margin:0;letter-spacing:.3em;color:var(--gold);animation:pulse 1.2s ease-in-out infinite}#summon small{opacity:.6;font-size:10px}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--c);max-width:80%;animation:rvin .5s ease-out}@keyframes rvin{from{transform:scale(.6);opacity:0}}
.rv .eg{width:calc(var(--vh)*24);height:calc(var(--vh)*24);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--vh)*13);border:2px solid var(--c);background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);box-shadow:0 0 40px var(--c)}
.rv h2{margin:0;font-size:20px;letter-spacing:.2em;color:#f3e3b3}.rv p{margin:0;font-size:12px}.rv .ab{color:#e8dcc0}.rv .tag{color:var(--gold);letter-spacing:.14em}
.acts2{display:flex;gap:10px;margin-top:4px}.acts2 button{min-height:36px;padding:6px 14px;font-size:12px}.acts2 button:disabled{opacity:.4}
@media (prefers-reduced-motion:reduce){.rune,.sline,.rv{animation:none}}
@media (orientation:landscape) and (max-height:480px){.ui{flex-direction:column;flex-wrap:nowrap;gap:14px;padding:12px}h1{font-size:clamp(34px,17vh,64px)}.tag{display:none}nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(80vw,440px)}nav button{min-height:46px;padding:10px 12px;font-size:16px}}
#build{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;opacity:.45;z-index:2}

</head>
<body>
<div class="scene" id="scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="ridge"></div>
</div>
<main class="ui" id="home"><div id="shards"></div><div id="build"></div>
  <div>
    <h1>LEGENDS</h1>
  </div>
  <nav>
    <button class="primary" id="play">PLAY</button>
    <button id="coll_btn">COLLECTION</button><button id="settings">SETTINGS</button>
    <button id="rules">RULES</button>
  </nav>
</main>
<section id="game" hidden>
  <aside class="side" id="mSlots"></aside>
  <div class="center">
    <div class="gbar"><button class="mini" id="gHome">HOME</button><button class="mini" id="fxBtn">FX</button><div class="chip" id="chip"></div><span id="turn"></span></div>
